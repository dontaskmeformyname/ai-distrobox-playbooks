---
- name: "Prüfen ob secrets.yml existiert"
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/secrets.yml"
  register: secrets_file
  delegate_to: localhost
  run_once: true

- name: "Warnung – secrets.yml fehlt"
  ansible.builtin.debug:
    msg:
      - "⚠️⚠️⚠️  secrets.yml nicht gefunden!"
      - ""
      - "  HuggingFace-Modelle werden ohne Token geladen."
      - "  Das kann zu Rate-Limits und fehlgeschlagenen Downloads führen."
      - ""
      - "  Beheben:"
      - "    cp secrets.yml.example secrets.yml"
      - "    # HF_TOKEN in secrets.yml eintragen"
      - "    # Token erstellen: https://huggingface.co/settings/tokens"
  when: not secrets_file.stat.exists

- name: "secrets.yml einlesen"
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/secrets.yml"
  when: secrets_file.stat.exists

- name: "Warnung – hf_token leer"
  ansible.builtin.debug:
    msg:
      - "⚠️  secrets.yml gefunden, aber hf_token ist leer!"
      - "  Trage deinen Token ein: https://huggingface.co/settings/tokens"
  when:
    - secrets_file.stat.exists
    - hf_token | default('') == ''

- name: "HF_TOKEN-Status anzeigen"
  ansible.builtin.debug:
    msg: "✅ HF_TOKEN geladen – HuggingFace Rate-Limits erhöht."
  when: hf_token | default('') != ''
