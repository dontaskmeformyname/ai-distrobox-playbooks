---
- name: "Prüfen ob supervisord bereits läuft"
  ansible.builtin.command:
    cmd: podman exec {{ container_name }} pgrep -x supervisord
  register: supervisord_running
  failed_when: false
  changed_when: false

- name: "supervisord starten"
  ansible.builtin.command:
    cmd: podman exec -d {{ container_name }} supervisord -c /etc/supervisor/supervisord.conf
  when: supervisord_running.rc != 0

- name: "Warten bis Ollama bereit ist (max 100s)"
  # 127.0.0.1 statt localhost: auf Systemen mit systemd-resolved loest
  # 'localhost' zu ::1 (IPv6) auf; Ollama lauscht nur auf IPv4.
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ollama_port }}/api/tags"
    status_code: 200
  register: ollama_ready
  until: ollama_ready.status == 200
  retries: 20
  delay: 5

- name: "Warten bis Open WebUI bereit ist (max 120s)"
  # Gleiches IPv4-Problem wie bei Ollama.
  # Open WebUI laedt beim ersten Start ein Embedding-Modell (~30s),
  # daher grosszuegiger Timeout.
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ webui_port }}"
    status_code: 200
  register: webui_ready
  until: webui_ready.status == 200
  retries: 24
  delay: 5
