# ==============================================================
# Playbook 1: Text-KI – Podman + GPU-Erkennung + Ollama + Open WebUI
# Unterstützte GPUs : NVIDIA (CUDA), AMD (ROCm), Intel (oneAPI)
# Headless-Server  : Desktop-Integration wird übersprungen
# Desktop          : systemd User-Service + .desktop-Eintrag
# Zielauswahl      : Standard ai_hosts, einschränkbar über --limit
# Ausführen mit    : ansible-playbook -i inventory 01_text_ai_setup.yml --ask-become-pass
#
# Voraussetzung Collection:
#   ansible-galaxy collection install containers.podman
#
# Optionale Secrets (nie nach GitHub pushen!):
#   cp secrets.yml.example secrets.yml
#   # HF_TOKEN eintragen, dann Playbook ausführen
# ==============================================================

# ---------------------------------------------------------------------------
# Play 1 – Secrets laden
# ---------------------------------------------------------------------------
- name: "Secrets laden"
  hosts: ai_hosts
  become: false
  gather_facts: false

  tasks:
    - name: "Pruefen ob secrets.yml existiert"
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/secrets.yml"
      register: secrets_file
      delegate_to: localhost
      run_once: true

    - name: "Warnung – secrets.yml fehlt"
      ansible.builtin.debug:
        msg:
          - "⚠️⚠️⚠️  secrets.yml nicht gefunden!"
          - ""
          - "  HuggingFace-Modelle werden ohne Token geladen."
          - "  Das kann zu Rate-Limits und fehlgeschlagenen Downloads führen."
          - ""
          - "  Beheben:"
          - "    cp secrets.yml.example secrets.yml"
          - "    # HF_TOKEN in secrets.yml eintragen"
          - "    # Token erstellen: https://huggingface.co/settings/tokens"
          - "    ansible-playbook -i inventory 01_text_ai_setup.yml --ask-become-pass"
      when: not secrets_file.stat.exists

    - name: "secrets.yml einlesen"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/secrets.yml"
      when: secrets_file.stat.exists

    - name: "Warnung – secrets.yml vorhanden aber hf_token leer"
      ansible.builtin.debug:
        msg:
          - "⚠️  secrets.yml gefunden, aber hf_token ist leer!"
          - ""
          - "  Trage deinen HuggingFace-Token in secrets.yml ein:"
          - "    hf_token: \"hf_DEINTOKEN\""
          - "  Token erstellen: https://huggingface.co/settings/tokens"
      when:
        - secrets_file.stat.exists
        - hf_token | default('') == ''

    - name: "HF_TOKEN-Status anzeigen"
      ansible.builtin.debug:
        msg: "✅ HF_TOKEN geladen – HuggingFace Rate-Limits erhöht."
      when: hf_token | default('') != ''

# ---------------------------------------------------------------------------
# Play 2 – GPU-Erkennung & Podman-Container anlegen (Host-Ebene)
# ---------------------------------------------------------------------------
- name: "GPU-Erkennung & Podman-Container anlegen"
  hosts: ai_hosts
  become: false

  vars:
    container_name: "ai-box"
    ollama_port: "11434"
    webui_port: "8080"
    data_dir: "{{ ansible_facts['env']['HOME'] }}/.local/share/ai-box"
    # Manuelle GPU-Auswahl bei mehreren GPUs im System
    # Hersteller:   "nvidia", "amd", "intel", "cpu", "" (= automatisch)
    # Mit Index:    "amd:0" (erste AMD), "amd:1" (zweite AMD)
    #               "nvidia:0" (erste NVIDIA), "nvidia:1" (zweite NVIDIA)
    # Per CLI:      -e gpu_override=amd:1
    gpu_override: ""
    # HSA_OVERRIDE_GFX_VERSION für AMD ROCm in Podman-Containern.
    # In Containern fehlt /sys/module/amdgpu/version – ROCm kann die
    # GPU-Architektur nicht automatisch ermitteln.
    # Wert ermitteln: rocminfo | grep 'Name:' | grep gfx
    # Häufige Werte:
    #   gfx1010 → 10.1.0  (RX 5700 XT, RDNA1)
    #   gfx1030 → 10.3.0  (RX 6800/6900 XT, RDNA2)
    #   gfx1100 → 11.0.0  (RX 7900 XTX, RDNA3)
    # Leer lassen wenn ROCm die GPU nativ erkennt.
    amd_gfx_version: ""

  tasks:
    - name: "Alle GPUs per lspci auflisten"
      ansible.builtin.shell:
        cmd: >-
          lspci | grep -E 'VGA compatible controller|3D controller|Display controller'
          | grep -iv 'non-volatile\|nvme\|storage\|memory controller'
      register: gpu_list_all
      failed_when: false
      changed_when: false

    - name: "Gefundene GPUs anzeigen"
      ansible.builtin.debug:
        msg: "{{ gpu_list_all.stdout_lines if gpu_list_all.stdout_lines | length > 0 else ['Keine GPU erkannt'] }}"

    - name: "NVIDIA GPUs per lspci erkennen"
      ansible.builtin.shell:
        cmd: >-
          lspci | grep -E 'VGA compatible controller|3D controller|Display controller'
          | grep -i nvidia
      register: nvidia_lspci_check
      failed_when: false
      changed_when: false

    - name: "AMD GPUs per lspci erkennen"
      ansible.builtin.shell:
        cmd: >-
          lspci | grep -E 'VGA compatible controller|3D controller|Display controller'
          | grep -iE 'amd|radeon|advanced micro devices'
      register: amd_lspci_check
      failed_when: false
      changed_when: false

    - name: "Intel GPUs per lspci erkennen"
      ansible.builtin.shell:
        cmd: lspci | grep -iE 'intel.*(graphics|vga|display|uhd|iris|arc)'
      register: intel_lspci_check
      failed_when: false
      changed_when: false

    - name: "GPU-Hersteller und Index aus gpu_override parsen"
      ansible.builtin.set_fact:
        _gpu_vendor: "{{ gpu_override.split(':')[0] if gpu_override != '' else '' }}"
        _gpu_index:  "{{ gpu_override.split(':')[1] | int if ':' in gpu_override else 0 }}"

    - name: "GPU-Flags setzen (Override oder auto-erkannt)"
      ansible.builtin.set_fact:
        gpu_nvidia: "{{ (_gpu_vendor == 'nvidia') or (_gpu_vendor == '' and nvidia_lspci_check.rc == 0) }}"
        gpu_amd:    "{{ (_gpu_vendor == 'amd')    or (_gpu_vendor == '' and amd_lspci_check.rc == 0) }}"
        gpu_intel:  "{{ (_gpu_vendor == 'intel')  or (_gpu_vendor == '' and intel_lspci_check.rc == 0) }}"

    - name: "AMD DRI-Node für gewählten Index ermitteln"
      ansible.builtin.shell:
        cmd: "ls /dev/dri/renderD* 2>/dev/null | sort | sed -n '{{ (_gpu_index | int) + 1 }}p'"
      register: amd_dri_node
      when: gpu_amd
      failed_when: false
      changed_when: false

    - name: "AMD DRI-Node setzen (Fallback renderD128)"
      ansible.builtin.set_fact:
        amd_render_node: "{{ amd_dri_node.stdout | default('/dev/dri/renderD128') | trim }}"
      when: gpu_amd

    - name: "NVIDIA GPU-Index für CUDA_VISIBLE_DEVICES setzen"
      ansible.builtin.set_fact:
        nvidia_gpu_index: "{{ _gpu_index }}"
      when: gpu_nvidia

    - name: "GPU-Ergebnis anzeigen"
      ansible.builtin.debug:
        msg: >-
          GPU-Erkennung: NVIDIA={{ gpu_nvidia }} AMD={{ gpu_amd }} Intel={{ gpu_intel }}
          {{ '(manuell: ' + gpu_override + ')' if gpu_override != '' else '(automatisch via lspci)' }}

    - name: "Warnung – mehrere GPU-Hersteller erkannt"
      ansible.builtin.debug:
        msg: >
          ⚠️  Mehrere GPU-Hersteller erkannt!
          Aktive Priorität: {{ 'NVIDIA' if gpu_nvidia else 'AMD' if gpu_amd else 'Intel' }}.
          Verwende gpu_override (z.B. -e gpu_override=amd:0).
      when: (gpu_nvidia | bool | int) + (gpu_amd | bool | int) + (gpu_intel | bool | int) > 1

    - name: "Warnung – mehrere NVIDIA GPUs erkannt"
      ansible.builtin.debug:
        msg: >
          ⚠️  {{ nvidia_lspci_check.stdout_lines | length }} NVIDIA GPUs gefunden.
          Aktiv: GPU-Index {{ nvidia_gpu_index | default(0) }}.
          Für eine andere GPU: -e gpu_override=nvidia:1
      when:
        - gpu_nvidia
        - nvidia_lspci_check.stdout_lines | length > 1

    - name: "Warnung – mehrere AMD GPUs erkannt"
      ansible.builtin.debug:
        msg: >
          ⚠️  {{ amd_lspci_check.stdout_lines | length }} AMD GPUs gefunden.
          Aktiv: {{ amd_render_node | default('/dev/dri/renderD128') }} (Index {{ _gpu_index }}).
          Für eine andere GPU: -e gpu_override=amd:1
      when:
        - gpu_amd
        - amd_lspci_check.stdout_lines | length > 1

    - name: "Warnung – keine GPU erkannt, CPU-only Modus"
      ansible.builtin.debug:
        msg: "⚠️ Keine GPU erkannt – Ollama läuft im CPU-only Modus."
      when: not gpu_nvidia and not gpu_amd and not gpu_intel

    - name: "Headless-Modus erkennen"
      ansible.builtin.set_fact:
        is_headless: >-
          {{ (ansible_facts['env'].get('DISPLAY', '') == '') and
             (ansible_facts['env'].get('WAYLAND_DISPLAY', '') == '') }}

    - name: "Modus anzeigen"
      ansible.builtin.debug:
        msg: "{{ 'Headless-Server erkannt – Desktop-Integration wird übersprungen.' if is_headless else 'Desktop erkannt – Desktop-Integration wird eingerichtet.' }}"

    - name: "User zur render-Gruppe hinzufügen (AMD/Intel)"
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        groups: render
        append: true
      become: true
      when: gpu_amd or gpu_intel

    - name: "User zur video-Gruppe hinzufügen"
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        groups: video
        append: true
      become: true

    - name: "Gruppenrechte für /dev/kfd setzen (AMD)"
      ansible.builtin.file:
        path: /dev/kfd
        group: render
        mode: "0660"
      become: true
      ignore_errors: true
      when: gpu_amd

    - name: "Datenverzeichnis für Container anlegen"
      ansible.builtin.file:
        path: "{{ data_dir }}"
        state: directory
        mode: "0755"

    - name: "Prüfen ob Container bereits existiert"
      ansible.builtin.command: podman container exists {{ container_name }}
      register: container_exists
      failed_when: false
      changed_when: false

    - name: "Podman Container anlegen (NVIDIA)"
      containers.podman.podman_container:
        name: "{{ container_name }}"
        image: ubuntu:24.04
        state: started
        command: sleep infinity
        detach: true
        security_opt:
          - label=disable
        ports:
          - "{{ ollama_port }}:11434"
          - "{{ webui_port }}:8080"
        volumes:
          - "{{ data_dir }}:/data:z"
        device:
          - "nvidia.com/gpu={{ nvidia_gpu_index | default(0) }}"
        env:
          OLLAMA_KEEP_ALIVE: "0"
          CUDA_VISIBLE_DEVICES: "{{ nvidia_gpu_index | default(0) }}"
          DATA_DIR: /data
      when:
        - container_exists.rc != 0
        - gpu_nvidia

    - name: "Podman Container anlegen (AMD)"
      containers.podman.podman_container:
        name: "{{ container_name }}"
        image: ubuntu:24.04
        state: started
        command: sleep infinity
        detach: true
        security_opt:
          - label=disable
        ports:
          - "{{ ollama_port }}:11434"
          - "{{ webui_port }}:8080"
        volumes:
          - "{{ data_dir }}:/data:z"
        device:
          - /dev/kfd
          - "{{ amd_render_node | default('/dev/dri/renderD128') }}"
        group_add:
          - render
          - video
        env: "{{ {'OLLAMA_KEEP_ALIVE': '0', 'DATA_DIR': '/data',
                   'HSA_OVERRIDE_GFX_VERSION': amd_gfx_version}
                  if amd_gfx_version != ''
                  else {'OLLAMA_KEEP_ALIVE': '0', 'DATA_DIR': '/data'} }}"
      when:
        - container_exists.rc != 0
        - gpu_amd
        - not gpu_nvidia

    - name: "Podman Container anlegen (Intel)"
      containers.podman.podman_container:
        name: "{{ container_name }}"
        image: ubuntu:24.04
        state: started
        command: sleep infinity
        detach: true
        security_opt:
          - label=disable
        ports:
          - "{{ ollama_port }}:11434"
          - "{{ webui_port }}:8080"
        volumes:
          - "{{ data_dir }}:/data:z"
        device:
          - /dev/dri
        env:
          OLLAMA_KEEP_ALIVE: "0"
          DATA_DIR: /data
      when:
        - container_exists.rc != 0
        - gpu_intel
        - not gpu_nvidia
        - not gpu_amd

    - name: "Podman Container anlegen (CPU-only Fallback)"
      containers.podman.podman_container:
        name: "{{ container_name }}"
        image: ubuntu:24.04
        state: started
        command: sleep infinity
        detach: true
        security_opt:
          - label=disable
        ports:
          - "{{ ollama_port }}:11434"
          - "{{ webui_port }}:8080"
        volumes:
          - "{{ data_dir }}:/data:z"
        env:
          OLLAMA_KEEP_ALIVE: "0"
          DATA_DIR: /data
      when:
        - container_exists.rc != 0
        - not gpu_nvidia
        - not gpu_amd
        - not gpu_intel

    - name: "Container starten falls gestoppt"
      containers.podman.podman_container:
        name: "{{ container_name }}"
        state: started
      when: container_exists.rc == 0

# ---------------------------------------------------------------------------
# Play 3 – Software im Container einrichten
#   Verbindung über containers.podman.podman – alle Ansible-Module
#   (apt, copy, template, pip, ...) arbeiten direkt im Container.
# ---------------------------------------------------------------------------
- name: "Text-KI Setup im Container"
  hosts: ai_hosts
  become: false
  gather_facts: false

  vars:
    container_name: "ai-box"
    hf_token: "{{ hf_token | default('') }}"
    # CORS auf localhost beschränken (kein offenes *)
    cors_origin: "http://localhost:8080"
    # USER_AGENT für LangChain-HTTP-Requests
    user_agent: "open-webui"

  tasks:
    # -- APT-Basis --------------------------------------------------------
    - name: "APT-Cache aktualisieren"
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      become: true
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

    - name: "Basis-Pakete installieren"
      # ffmpeg: wird von Open WebUI fuer Whisper-Spracheingabe benoetigt
      # supervisor: Prozessmanager fuer Ollama + Open WebUI
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - gpg
          - ca-certificates
          - zstd
          - python3
          - python3-pip
          - supervisor
          - ffmpeg
        state: present
      become: true
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

    - name: "Keyrings-Verzeichnis anlegen"
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      become: true
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

    # -- NVIDIA CUDA ------------------------------------------------------
    - name: "NVIDIA CUDA Keyring herunterladen"
      ansible.builtin.get_url:
        url: https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
        dest: /tmp/cuda-keyring.deb
        mode: "0644"
      become: true
      when: gpu_nvidia | default(false) | bool
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

    - name: "NVIDIA CUDA Keyring installieren"
      ansible.builtin.apt:
        deb: /tmp/cuda-keyring.deb
      become: true
      when: gpu_nvidia | default(false) | bool
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

    - name: "APT-Cache nach CUDA-Repo aktualisieren"
      ansible.builtin.apt:
        update_cache: true
      become: true
      when: gpu_nvidia | default(false) | bool
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

    # -- AMD ROCm ---------------------------------------------------------
    - name: "AMD ROCm GPG-Key herunterladen und als Keyring speichern"
      ansible.builtin.shell:
        cmd: curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor > /etc/apt/keyrings/rocm.gpg
        creates: /etc/apt/keyrings/rocm.gpg
      become: true
      when: gpu_amd | default(false) | bool
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

    - name: "AMD ROCm APT-Repository einrichten"
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/latest noble main"
        state: present
        filename: rocm
        update_cache: true
      become: true
      when: gpu_amd | default(false) | bool
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

    - name: "APT-Pinning für ROCm einrichten"
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/rocm-pin-600
        mode: "0644"
        content: |
          Package: *
          Pin: release o=repo.radeon.com
          Pin-Priority: 600
      become: true
      when: gpu_amd | default(false) | bool
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

    - name: "AMD ROCm installieren"
      ansible.builtin.apt:
        name: rocm
        state: present
      become: true
      when: gpu_amd | default(false) | bool
      async: 3600
      poll: 15
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

    # -- Intel oneAPI -----------------------------------------------------
    - name: "Intel GPU GPG-Key herunterladen und als Keyring speichern"
      ansible.builtin.shell:
        cmd: curl -fsSL https://repositories.intel.com/gpu/intel-graphics.key | gpg --dearmor > /etc/apt/keyrings/intel-graphics.gpg
        creates: /etc/apt/keyrings/intel-graphics.gpg
      become: true
      when: gpu_intel | default(false) | bool
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

    - name: "Intel GPU APT-Repository einrichten"
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/intel-graphics.gpg] https://repositories.intel.com/gpu/ubuntu noble client"
        state: present
        filename: intel-gpu
        update_cache: true
      become: true
      when: gpu_intel | default(false) | bool
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

    - name: "Intel Level Zero installieren"
      ansible.builtin.apt:
        name:
          - intel-opencl-icd
          - intel-level-zero-gpu
          - level-zero
        state: present
      become: true
      when: gpu_intel | default(false) | bool
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

    # -- Ollama -----------------------------------------------------------
    - name: "Prüfen ob Ollama bereits installiert ist"
      ansible.builtin.stat:
        path: /usr/local/bin/ollama
      register: ollama_bin
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

    - name: "Ollama Install-Skript herunterladen"
      ansible.builtin.get_url:
        url: https://ollama.com/install.sh
        dest: /tmp/ollama-install.sh
        mode: "0755"
      become: true
      when: not ollama_bin.stat.exists
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

    - name: "Ollama installieren"
      ansible.builtin.command:
        cmd: /tmp/ollama-install.sh
        creates: /usr/local/bin/ollama
      become: true
      when: not ollama_bin.stat.exists
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

    # -- Open WebUI -------------------------------------------------------
    - name: "Open WebUI per pip installieren"
      ansible.builtin.pip:
        name: open-webui
        state: present
        extra_args: "--break-system-packages"
      become: true
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

    # -- Supervisor-Konfiguration -----------------------------------------
    - name: "Supervisor conf.d-Verzeichnis anlegen"
      ansible.builtin.file:
        path: /etc/supervisor/conf.d
        state: directory
        mode: "0755"
      become: true
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

    - name: "Supervisor-Konfiguration schreiben"
      # Gesetzte Umgebungsvariablen für open-webui:
      #   HF_TOKEN          – HuggingFace Token (optional, aus secrets.yml)
      #   CORS_ALLOW_ORIGIN – auf localhost beschränken (kein offenes *)
      #   USER_AGENT        – identifiziert LangChain-HTTP-Requests
      #   PYTHONUNBUFFERED  – Logs ohne Pufferung
      ansible.builtin.template:
        src: templates/ai-box-supervisor.conf.j2
        dest: /etc/supervisor/conf.d/ai-box.conf
        mode: "0644"
      become: true
      no_log: true
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"
      notify: supervisord neu laden

  handlers:
    - name: supervisord neu laden
      ansible.builtin.command:
        cmd: supervisorctl reread && supervisorctl update
      become: true
      failed_when: false
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

# ---------------------------------------------------------------------------
# Play 4 – supervisord starten, Bereitschaft prüfen
# ---------------------------------------------------------------------------
- name: "Dienste starten und auf Bereitschaft warten"
  hosts: ai_hosts
  become: false
  gather_facts: false

  vars:
    container_name: "ai-box"

  tasks:
    - name: "Prüfen ob supervisord bereits läuft"
      ansible.builtin.command:
        cmd: pgrep -x supervisord
      register: supervisord_running
      failed_when: false
      changed_when: false
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

    - name: "supervisord starten (startet Ollama + Open WebUI automatisch)"
      ansible.builtin.command:
        cmd: supervisord -c /etc/supervisor/supervisord.conf
      become: true
      when: supervisord_running.rc != 0
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

    - name: "Warten bis Ollama bereit ist (max 30s)"
      ansible.builtin.uri:
        url: http://localhost:11434/api/tags
        status_code: 200
      register: ollama_ready
      until: ollama_ready.status == 200
      retries: 10
      delay: 3
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

    - name: "Warten bis Open WebUI bereit ist (max 60s)"
      ansible.builtin.uri:
        url: http://localhost:8080
        status_code: 200
      register: webui_ready
      until: webui_ready.status == 200
      retries: 20
      delay: 3
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_container: "{{ container_name }}"

# ---------------------------------------------------------------------------
# Play 5 – systemd User-Service und Desktop-Integration (Host-Ebene)
# ---------------------------------------------------------------------------
- name: "systemd User-Service und Desktop-Integration"
  hosts: ai_hosts
  become: false

  vars:
    container_name: "ai-box"
    ollama_port: "11434"
    webui_port: "8080"

  tasks:
    - name: "systemd User-Service Verzeichnis sicherstellen"
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user"
        state: directory
        mode: "0755"

    - name: "systemd User-Service für ai-box erstellen"
      ansible.builtin.copy:
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/ai-box.service"
        mode: "0644"
        content: |
          [Unit]
          Description=AI Box Podman Container (Ollama + Open WebUI)
          After=default.target

          [Service]
          Type=simple
          ExecStart=podman start -a {{ container_name }}
          ExecStartPost=/bin/sh -c 'sleep 2 && podman exec -d {{ container_name }} supervisord -c /etc/supervisor/supervisord.conf'
          ExecStop=podman stop {{ container_name }}
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=default.target

    - name: "systemd User-Service aktivieren und starten"
      ansible.builtin.systemd:
        name: ai-box.service
        state: started
        enabled: true
        scope: user
        daemon_reload: true

    - name: "Lokales bin-Verzeichnis sicherstellen"
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: "0755"

    - name: "Launcher-Skript aus Template erzeugen"
      ansible.builtin.template:
        src: templates/text-ki-start.j2
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/text-ki-start"
        mode: "0755"

    - name: "Lokales applications-Verzeichnis sicherstellen"
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/share/applications"
        state: directory
        mode: "0755"
      when: not (is_headless | default(true) | bool)

    - name: "Desktop-Eintrag erstellen"
      ansible.builtin.copy:
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/applications/text-ki.desktop"
        mode: "0644"
        content: |
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Text KI
          GenericName=Lokale Text-KI
          Comment=Ollama und Open WebUI starten
          Exec={{ ansible_facts['env']['HOME'] }}/.local/bin/text-ki-start
          Icon=text-editor
          Terminal=false
          Categories=Science;Education;
          Keywords=AI;LLM;Ollama;
          StartupNotify=true
      when: not (is_headless | default(true) | bool)

    - name: "Desktop-Datenbank aktualisieren"
      ansible.builtin.command:
        cmd: update-desktop-database {{ ansible_facts['env']['HOME'] }}/.local/share/applications
      changed_when: false
      failed_when: false
      when: not (is_headless | default(true) | bool)

    - name: "Zusammenfassung"
      ansible.builtin.debug:
        msg:
          - "╔════════════════════════════════════════════════════╗"
          - "║  ✅  Text-KI Setup abgeschlossen!                  ║"
          - "╚════════════════════════════════════════════════════╝"
          - ""
          - "  GPU: NVIDIA={{ gpu_nvidia }} AMD={{ gpu_amd }} Intel={{ gpu_intel }}"
          - "  Auswahl: {{ gpu_override if gpu_override != '' else 'automatisch' }}"
          - "  Modus: {{ 'Headless-Server' if is_headless else 'Desktop' }}"
          - "  HF_TOKEN: {{ '✅ gesetzt' if hf_token | default('') != '' else '⚠️ nicht gesetzt – siehe secrets.yml.example' }}"
          - ""
          - "  → Dienste starten: systemctl --user start ai-box"
          - "  → Open WebUI:      http://localhost:{{ webui_port }}"
          - "  → Ollama API:      http://localhost:{{ ollama_port }}"
          - ""
          - "  Logs im Container:"
          - "    podman exec ai-box tail -f /data/webui.log"
          - "    podman exec ai-box tail -f /data/ollama.log"
          - ""
          - "  Erstes Modell laden:"
          - "  podman exec ai-box ollama pull llama3.2"
