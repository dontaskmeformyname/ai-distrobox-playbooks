# ==============================================================
# Playbook 1: Text-KI – Podman + GPU-Erkennung + Ollama + Open WebUI
#
# Voraussetzung Collection:
#   ansible-galaxy collection install containers.podman
#
# Optionale Secrets (nie nach GitHub pushen!):
#   cp secrets.yml.example secrets.yml
#
# Ausführen mit:
#   ansible-playbook -i inventory 01_text_ai_setup.yml --ask-become-pass
# ==============================================================

- name: "Secrets laden"
  hosts: ai_hosts
  become: false
  gather_facts: false
  tasks:
    - ansible.builtin.include_role:
        name: text_ai
        tasks_from: secrets.yml

- name: "GPU-Erkennung & Container anlegen"
  hosts: ai_hosts
  become: false
  tasks:
    - ansible.builtin.include_role:
        name: text_ai
        tasks_from: gpu_detect.yml
    - ansible.builtin.include_role:
        name: text_ai
        tasks_from: container_create.yml
    - ansible.builtin.include_role:
        name: text_ai
        tasks_from: host_register.yml

- name: "Software im Container einrichten"
  hosts: ai_box_container
  # containers.podman.podman verbindet via 'podman exec' direkt als root.
  # sudo ist in ubuntu:24.04 nicht vorinstalliert – become muss false sein.
  become: false
  gather_facts: false
  tasks:
    - ansible.builtin.include_role:
        name: text_ai
        tasks_from: container_setup.yml

- name: "Dienste starten & Bereitschaft prüfen"
  hosts: ai_hosts
  become: false
  gather_facts: false
  tasks:
    - ansible.builtin.include_role:
        name: text_ai
        tasks_from: services_start.yml

- name: "systemd User-Service & Desktop-Integration"
  hosts: ai_hosts
  become: false
  tasks:
    - ansible.builtin.include_role:
        name: text_ai
        tasks_from: host_integration.yml
