---
# ============================================================
# Playbook 1: Text-KI – Distrobox Container + ROCm + Ollama + Open WebUI
# Ziel-Hardware: AMD Radeon RX 6900 XT (gfx1030 / RDNA2)
# Ausführen mit: ansible-playbook 01_text_ai_setup.yml
# ============================================================

- name: Text-KI Setup (Ollama + Open WebUI)
  hosts: localhost
  connection: local
  become: false

  vars:
    container_name: "ai-box"
    container_image: "ubuntu:24.04"
    rocm_deb_version: "6.4.70400-1"
    rocm_path_version: "6.4"
    ollama_keep_alive: "0"
    ollama_port: "11434"
    webui_port: "8080"
    hsa_override: "10.3.0"

  tasks:

    # ── HOST: Gruppen & Gerätezugriff ───────────────────────
    - name: User zu render-Gruppe hinzufügen
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        groups: render
        append: true
      become: true

    - name: User zu video-Gruppe hinzufügen
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        groups: video
        append: true
      become: true

    - name: /dev/kfd Gruppenrechte setzen
      ansible.builtin.file:
        path: /dev/kfd
        group: render
        mode: "0660"
      become: true
      ignore_errors: true

    # ── DISTROBOX: Container erstellen ──────────────────────
    - name: Prüfe ob Container bereits existiert
      ansible.builtin.command: distrobox list
      register: container_list
      changed_when: false

    - name: Distrobox Container anlegen
      ansible.builtin.command: >
        distrobox create
        --name {{ container_name }}
        --image {{ container_image }}
        --additional-flags "--device=/dev/kfd --device=/dev/dri --group-add=render --group-add=video"
        --yes
      when: container_name not in container_list.stdout

    - name: Container initialisieren (erster Start)
      ansible.builtin.command: distrobox enter {{ container_name }} -- true
      changed_when: false

    # ── CONTAINER: ROCm installieren ────────────────────────
    - name: Prüfe ob ROCm bereits vorhanden
      ansible.builtin.command: >
        distrobox enter {{ container_name }} -- which rocminfo
      register: rocm_check
      changed_when: false
      failed_when: false

    - name: Basis-Pakete installieren
      ansible.builtin.command: >
        distrobox enter {{ container_name }} -- bash -c
        "sudo apt-get update -qq && sudo apt-get install -y wget gpg ca-certificates"
      when: rocm_check.rc != 0

    - name: amdgpu-install Paket herunterladen
      ansible.builtin.command: >
        distrobox enter {{ container_name }} -- bash -c
        "wget -q https://repo.radeon.com/amdgpu-install/{{ rocm_path_version }}/ubuntu/noble/amdgpu-install_{{ rocm_deb_version }}_all.deb
        -O /tmp/amdgpu-install.deb"
      when: rocm_check.rc != 0

    - name: amdgpu-install Paket installieren
      ansible.builtin.command: >
        distrobox enter {{ container_name }} -- bash -c
        "sudo apt-get install -y /tmp/amdgpu-install.deb"
      when: rocm_check.rc != 0

    - name: ROCm installieren (ohne DKMS – Kernel-Treiber läuft auf dem Host)
      ansible.builtin.command: >
        distrobox enter {{ container_name }} -- bash -c
        "sudo amdgpu-install --usecase=rocm --no-dkms -y"
      when: rocm_check.rc != 0
      async: 600
      poll: 15

    - name: Container-User zu render/video hinzufügen
      ansible.builtin.command: >
        distrobox enter {{ container_name }} -- bash -c
        "sudo usermod -aG render,video $(whoami)"
      when: rocm_check.rc != 0

    # ── CONTAINER: Ollama installieren ──────────────────────
    - name: Prüfe ob Ollama bereits installiert
      ansible.builtin.command: >
        distrobox enter {{ container_name }} -- which ollama
      register: ollama_check
      changed_when: false
      failed_when: false

    - name: Ollama installieren
      ansible.builtin.command: >
        distrobox enter {{ container_name }} -- bash -c
        "curl -fsSL https://ollama.com/install.sh | sh"
      when: ollama_check.rc != 0

    - name: OLLAMA_KEEP_ALIVE in .bashrc setzen (VRAM sofort freigeben)
      ansible.builtin.command: >
        distrobox enter {{ container_name }} -- bash -c
        "grep -q 'OLLAMA_KEEP_ALIVE' ~/.bashrc ||
        echo 'export OLLAMA_KEEP_ALIVE={{ ollama_keep_alive }}' >> ~/.bashrc"
      changed_when: false

    - name: HSA_OVERRIDE_GFX_VERSION in .bashrc setzen (RX 6900 XT = gfx1030)
      ansible.builtin.command: >
        distrobox enter {{ container_name }} -- bash -c
        "grep -q 'HSA_OVERRIDE_GFX_VERSION' ~/.bashrc ||
        echo 'export HSA_OVERRIDE_GFX_VERSION={{ hsa_override }}' >> ~/.bashrc"
      changed_when: false

    # ── HOST: Systemd User-Service für Ollama ───────────────
    - name: Systemd User-Verzeichnis sicherstellen
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.config/systemd/user"
        state: directory
        mode: "0755"

    - name: Ollama systemd User-Service erstellen
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/.config/systemd/user/ollama-distrobox.service"
        mode: "0644"
        content: |
          [Unit]
          Description=Ollama LLM Server (in Distrobox ai-box)
          After=default.target

          [Service]
          ExecStart=distrobox enter {{ container_name }} -- \
            bash -c "OLLAMA_KEEP_ALIVE={{ ollama_keep_alive }} \
            HSA_OVERRIDE_GFX_VERSION={{ hsa_override }} ollama serve"
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=default.target

    - name: Systemd User-Daemon neu laden
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user

    - name: Ollama-Service aktivieren und starten
      ansible.builtin.systemd:
        name: ollama-distrobox.service
        enabled: true
        state: started
        scope: user

    # ── HOST: Open WebUI via Podman ─────────────────────────
    - name: Prüfe ob Podman verfügbar ist
      ansible.builtin.command: which podman
      register: podman_check
      changed_when: false
      failed_when: false

    - name: Prüfe ob Open WebUI Container bereits läuft
      ansible.builtin.command: podman ps -a --format "{{ '{{' }}.Names{{ '}}' }}"
      register: podman_containers
      changed_when: false
      when: podman_check.rc == 0

    - name: Open WebUI Container starten
      ansible.builtin.command: >
        podman run -d
        --name open-webui
        --network=host
        -e OLLAMA_BASE_URL=http://127.0.0.1:{{ ollama_port }}
        -v open-webui:/app/backend/data
        --restart=always
        ghcr.io/open-webui/open-webui:main
      when:
        - podman_check.rc == 0
        - "'open-webui' not in podman_containers.stdout"

    - name: Open WebUI systemd User-Service erstellen
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/.config/systemd/user/open-webui.service"
        mode: "0644"
        content: |
          [Unit]
          Description=Open WebUI (Ollama Chat-Interface)
          After=ollama-distrobox.service

          [Service]
          ExecStart=podman start -a open-webui
          ExecStop=podman stop open-webui
          Restart=on-failure
          RestartSec=10

          [Install]
          WantedBy=default.target
      when: podman_check.rc == 0

    - name: Open WebUI Service aktivieren
      ansible.builtin.systemd:
        name: open-webui.service
        enabled: true
        daemon_reload: true
        scope: user
      when: podman_check.rc == 0

    # ── ABSCHLUSS ────────────────────────────────────────────
    - name: Zusammenfassung
      ansible.builtin.debug:
        msg:
          - "╔══════════════════════════════════════════════╗"
          - "║  ✅  Text-KI Setup abgeschlossen!            ║"
          - "╚══════════════════════════════════════════════╝"
          - ""
          - "  Ollama API  →  http://localhost:{{ ollama_port }}"
          - "  Open WebUI  →  http://localhost:{{ webui_port }}"
          - ""
          - "  Modell laden:"
          - "  distrobox enter {{ container_name }} -- ollama pull llama3.2"
          - "  distrobox enter {{ container_name }} -- ollama pull mistral"
          - "  distrobox enter {{ container_name }} -- ollama pull deepseek-r1:14b"
