# ==============================================================
# Playbook 1: Text-KI – Podman + GPU-Erkennung + Ollama + Open WebUI
# Unterstützte GPUs : NVIDIA (CUDA), AMD (ROCm), Intel (oneAPI)
# Headless-Server  : Desktop-Integration wird übersprungen
# Desktop          : systemd User-Service + .desktop-Eintrag
# Zielauswahl      : Standard ai_hosts, einschränkbar über --limit
# Ausführen mit    : ansible-playbook -i inventory 01_text_ai_setup.yml --ask-become-pass
# ==============================================================

- name: GPU-Erkennung & Podman-Vorbereitung
  hosts: ai_hosts
  become: false

  vars:
    container_name: "ai-box"
    ollama_port: "11434"
    webui_port: "8080"
    data_dir: "{{ ansible_env.HOME }}/.local/share/ai-box"

  tasks:
    - name: NVIDIA GPU prüfen (nvidia-smi)
      ansible.builtin.command: nvidia-smi
      register: nvidia_check
      failed_when: false
      changed_when: false

    - name: AMD GPU prüfen (rocminfo)
      ansible.builtin.command: rocminfo
      register: amd_check
      failed_when: false
      changed_when: false

    - name: Intel GPU prüfen (/dev/dri/renderD128 + vendor ID)
      ansible.builtin.shell: |
        ls /dev/dri/renderD128 2>/dev/null && \
        grep -qi 'intel\|8086' /sys/class/drm/card*/device/vendor 2>/dev/null
      register: intel_check
      failed_when: false
      changed_when: false

    - name: Erkannte GPU-Flags setzen
      ansible.builtin.set_fact:
        gpu_nvidia: "{{ nvidia_check.rc == 0 }}"
        gpu_amd: "{{ amd_check.rc == 0 }}"
        gpu_intel: "{{ intel_check.rc == 0 }}"

    - name: GPU-Ergebnis anzeigen
      ansible.builtin.debug:
        msg: >-
          GPU-Erkennung: NVIDIA={{ gpu_nvidia }} AMD={{ gpu_amd }} Intel={{ gpu_intel }}

    - name: Warnung – keine GPU erkannt (CPU-only Modus)
      ansible.builtin.debug:
        msg: "⚠️ Keine GPU erkannt – Ollama läuft im CPU-only Modus."
      when: not gpu_nvidia and not gpu_amd and not gpu_intel

    - name: Headless-Modus erkennen (kein DISPLAY/WAYLAND_DISPLAY)
      ansible.builtin.set_fact:
        is_headless: >-
          {{ (ansible_env.DISPLAY | default('') == '') and
             (ansible_env.WAYLAND_DISPLAY | default('') == '') }}

    - name: Modus anzeigen
      ansible.builtin.debug:
        msg: "{{ 'Headless-Server erkannt – Desktop-Integration wird übersprungen.' if is_headless else 'Desktop erkannt – Desktop-Integration wird eingerichtet.' }}"

    - name: User zur render-Gruppe hinzufügen (AMD/Intel)
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        groups: render
        append: true
      become: true
      when: gpu_amd or gpu_intel

    - name: User zur video-Gruppe hinzufügen
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        groups: video
        append: true
      become: true

    - name: /dev/kfd Gruppenrechte setzen (AMD)
      ansible.builtin.file:
        path: /dev/kfd
        group: render
        mode: "0660"
      become: true
      ignore_errors: true
      when: gpu_amd

    - name: Datenverzeichnis für Container anlegen
      ansible.builtin.file:
        path: "{{ data_dir }}"
        state: directory
        mode: "0755"

    - name: Prüfe ob Container bereits existiert
      ansible.builtin.command: podman ps -a --format '{{.Names}}'
      register: container_list
      changed_when: false

    - name: Podman Container anlegen (NVIDIA)
      ansible.builtin.command: >-
        podman run -d
        --name {{ container_name }}
        --device nvidia.com/gpu=all
        --security-opt=label=disable
        -p {{ ollama_port }}:11434
        -p {{ webui_port }}:8080
        -v {{ data_dir }}:/data:z
        -e OLLAMA_KEEP_ALIVE=0
        -e DATA_DIR=/data
        ubuntu:24.04 sleep infinity
      when:
        - container_name not in container_list.stdout_lines
        - gpu_nvidia

    - name: Podman Container anlegen (AMD)
      ansible.builtin.command: >-
        podman run -d
        --name {{ container_name }}
        --device /dev/kfd
        --device /dev/dri
        --security-opt=label=disable
        -p {{ ollama_port }}:11434
        -p {{ webui_port }}:8080
        -v {{ data_dir }}:/data:z
        -e OLLAMA_KEEP_ALIVE=0
        -e HSA_OVERRIDE_GFX_VERSION={{ amd_gfx_version | default('11.0.0') }}
        -e DATA_DIR=/data
        ubuntu:24.04 sleep infinity
      when:
        - container_name not in container_list.stdout_lines
        - gpu_amd
        - not gpu_nvidia

    - name: Podman Container anlegen (Intel)
      ansible.builtin.command: >-
        podman run -d
        --name {{ container_name }}
        --device /dev/dri
        --security-opt=label=disable
        -p {{ ollama_port }}:11434
        -p {{ webui_port }}:8080
        -v {{ data_dir }}:/data:z
        -e OLLAMA_KEEP_ALIVE=0
        -e DATA_DIR=/data
        ubuntu:24.04 sleep infinity
      when:
        - container_name not in container_list.stdout_lines
        - gpu_intel
        - not gpu_nvidia
        - not gpu_amd

    - name: Podman Container anlegen (CPU-only Fallback)
      ansible.builtin.command: >-
        podman run -d
        --name {{ container_name }}
        --security-opt=label=disable
        -p {{ ollama_port }}:11434
        -p {{ webui_port }}:8080
        -v {{ data_dir }}:/data:z
        -e OLLAMA_KEEP_ALIVE=0
        -e DATA_DIR=/data
        ubuntu:24.04 sleep infinity
      when:
        - container_name not in container_list.stdout_lines
        - not gpu_nvidia
        - not gpu_amd
        - not gpu_intel

- name: Text-KI Setup innerhalb des Podman Containers
  hosts: ai_hosts
  become: false
  gather_facts: false

  vars:
    container_name: "ai-box"

  tasks:
    - name: APT-Cache updaten
      ansible.builtin.command: podman exec -u root {{ container_name }} apt-get update -qq
      changed_when: false

    - name: Erforderliche Basis-Pakete installieren
      ansible.builtin.command: >-
        podman exec -u root {{ container_name }}
        apt-get install -y curl wget gpg ca-certificates zstd python3 python3-pip
      changed_when: true

    - name: Keyrings Verzeichnis erstellen
      ansible.builtin.command: podman exec -u root {{ container_name }} mkdir -p /etc/apt/keyrings
      changed_when: false

    - name: NVIDIA CUDA Repository einrichten
      ansible.builtin.command: >-
        podman exec -u root {{ container_name }} bash -c
        "curl -fsSL https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb -o /tmp/cuda-keyring.deb &&
         dpkg -i /tmp/cuda-keyring.deb &&
         apt-get update -qq"
      when: gpu_nvidia | default(false) | bool
      changed_when: true

    - name: AMD ROCm GPG-Key herunterladen
      ansible.builtin.command: >-
        podman exec -u root {{ container_name }} bash -c
        "curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor > /etc/apt/keyrings/rocm.gpg"
      when: gpu_amd | default(false) | bool
      changed_when: true

    - name: AMD ROCm APT-Repository hinzufügen
      ansible.builtin.command: >-
        podman exec -u root {{ container_name }} bash -c
        "echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/latest noble main' > /etc/apt/sources.list.d/rocm.list &&
         apt-get update -qq"
      when: gpu_amd | default(false) | bool
      changed_when: true

    - name: AMD ROCm installieren
      ansible.builtin.command: >-
        podman exec -u root {{ container_name }} apt-get install -y rocm
      when: gpu_amd | default(false) | bool
      async: 3600
      poll: 15
      changed_when: true

    - name: Intel oneAPI Repository einrichten
      ansible.builtin.command: >-
        podman exec -u root {{ container_name }} bash -c
        "curl -fsSL https://repositories.intel.com/gpu/intel-graphics.key | gpg --dearmor > /etc/apt/keyrings/intel-graphics.gpg &&
         echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/intel-graphics.gpg] https://repositories.intel.com/gpu/ubuntu noble client' > /etc/apt/sources.list.d/intel-gpu.list &&
         apt-get update -qq"
      when: gpu_intel | default(false) | bool
      changed_when: true

    - name: Intel Level Zero installieren
      ansible.builtin.command: >-
        podman exec -u root {{ container_name }}
        apt-get install -y intel-opencl-icd intel-level-zero-gpu level-zero
      when: gpu_intel | default(false) | bool
      changed_when: true

    - name: Prüfe ob Ollama bereits installiert ist
      ansible.builtin.command: podman exec {{ container_name }} which ollama
      register: ollama_check
      failed_when: false
      changed_when: false

    - name: Ollama über Install-Skript installieren
      ansible.builtin.command: >-
        podman exec -u root {{ container_name }} bash -c
        "curl -fsSL https://ollama.com/install.sh | sh"
      when: ollama_check.rc != 0
      changed_when: true

    - name: Open WebUI über pip installieren
      ansible.builtin.command: >-
        podman exec -u root {{ container_name }}
        pip3 install open-webui --break-system-packages
      changed_when: true

- name: systemd User-Service + Desktop-Integration
  hosts: ai_hosts
  become: false

  vars:
    container_name: "ai-box"
    ollama_port: "11434"
    webui_port: "8080"

  tasks:
    - name: systemd User-Service Verzeichnis sicherstellen
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.config/systemd/user"
        state: directory
        mode: "0755"

    - name: systemd User-Service für ai-box erstellen
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/.config/systemd/user/ai-box.service"
        mode: "0644"
        content: |
          [Unit]
          Description=AI Box Podman Container (Ollama + Open WebUI)
          After=default.target

          [Service]
          Type=simple
          ExecStart=podman start -a {{ container_name }}
          ExecStop=podman stop {{ container_name }}
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=default.target

    - name: systemd User-Service aktivieren und starten
      ansible.builtin.systemd:
        name: ai-box.service
        state: started
        enabled: true
        scope: user
        daemon_reload: true

    - name: Lokales bin-Verzeichnis sicherstellen
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.local/bin"
        state: directory
        mode: "0755"

    - name: Launcher-Skript aus Template erzeugen
      ansible.builtin.template:
        src: templates/text-ki-start.j2
        dest: "{{ ansible_env.HOME }}/.local/bin/text-ki-start"
        mode: "0755"

    - name: Lokales applications-Verzeichnis sicherstellen
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.local/share/applications"
        state: directory
        mode: "0755"
      when: not (is_headless | default(true) | bool)

    - name: Desktop-Eintrag erstellen
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/.local/share/applications/text-ki.desktop"
        mode: "0644"
        content: |
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Text KI
          GenericName=Lokale Text-KI
          Comment=Ollama und Open WebUI starten
          Exec={{ ansible_env.HOME }}/.local/bin/text-ki-start
          Icon=text-editor
          Terminal=false
          Categories=Science;Education;
          Keywords=AI;LLM;Ollama;
          StartupNotify=true
      when: not (is_headless | default(true) | bool)

    - name: Desktop-Datenbank aktualisieren
      ansible.builtin.command: >-
        update-desktop-database {{ ansible_env.HOME }}/.local/share/applications
      changed_when: false
      failed_when: false
      when: not (is_headless | default(true) | bool)

    - name: Zusammenfassung
      ansible.builtin.debug:
        msg:
          - "╔════════════════════════════════════════════════════╗"
          - "║  ✅  Text-KI Setup abgeschlossen!                  ║"
          - "╚════════════════════════════════════════════════════╝"
          - ""
          - "  Erkannte GPU: NVIDIA={{ gpu_nvidia }}  AMD={{ gpu_amd }}  Intel={{ gpu_intel }}"
          - "  Modus: {{ 'Headless-Server' if is_headless else 'Desktop' }}"
          - ""
          - "  → Dienste starten: systemctl --user start ai-box"
          - "  → Open WebUI:      http://localhost:{{ webui_port }}"
          - "  → Ollama API:      http://localhost:{{ ollama_port }}"
          - ""
          - "  Erstes Modell laden:"
          - "  podman exec {{ container_name }} ollama pull llama3.2"
