# ==============================================================
# Playbook 1: Text-KI – Podman + GPU-Erkennung + Ollama + Open WebUI
# Unterstützte GPUs : NVIDIA (CUDA), AMD (ROCm), Intel (oneAPI)
# Headless-Server  : Desktop-Integration wird übersprungen
# Desktop          : systemd User-Service + .desktop-Eintrag
# Zielauswahl      : Standard ai_hosts, einschränkbar über --limit
# Ausführen mit    : ansible-playbook -i inventory 01_text_ai_setup.yml --ask-become-pass
#
# Optionale Secrets (nie nach GitHub pushen!):
#   cp secrets.yml.example secrets.yml
#   # HF_TOKEN eintragen, dann Playbook ausführen
# ==============================================================

# Secrets aus lokaler Datei laden (nicht im Repo enthalten)
- name: "Secrets laden"
  hosts: ai_hosts
  become: false
  gather_facts: false

  tasks:
    - name: "Pruefen ob secrets.yml existiert"
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/secrets.yml"
      register: secrets_file
      delegate_to: localhost
      run_once: true

    - name: "Warnung – secrets.yml fehlt"
      ansible.builtin.debug:
        msg:
          - "⚠️⚠️⚠️  secrets.yml nicht gefunden!"
          - ""
          - "  HuggingFace-Modelle werden ohne Token geladen."
          - "  Das kann zu Rate-Limits und fehlgeschlagenen Downloads führen."
          - ""
          - "  Beheben:"
          - "    cp secrets.yml.example secrets.yml"
          - "    # HF_TOKEN in secrets.yml eintragen"
          - "    # Token erstellen: https://huggingface.co/settings/tokens"
          - "    ansible-playbook -i inventory 01_text_ai_setup.yml --ask-become-pass"
      when: not secrets_file.stat.exists

    - name: "secrets.yml einlesen"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/secrets.yml"
      when: secrets_file.stat.exists

    - name: "Warnung – secrets.yml vorhanden aber hf_token leer"
      ansible.builtin.debug:
        msg:
          - "⚠️  secrets.yml gefunden, aber hf_token ist leer!"
          - ""
          - "  Trage deinen HuggingFace-Token in secrets.yml ein:"
          - "    hf_token: \"hf_DEINTOKEN\""
          - "  Token erstellen: https://huggingface.co/settings/tokens"
      when:
        - secrets_file.stat.exists
        - hf_token | default('') == ''

    - name: "HF_TOKEN-Status anzeigen"
      ansible.builtin.debug:
        msg: "✅ HF_TOKEN geladen – HuggingFace Rate-Limits erhöht."
      when: hf_token | default('') != ''

- name: "GPU-Erkennung & Podman-Vorbereitung"
  hosts: ai_hosts
  become: false

  vars:
    container_name: "ai-box"
    ollama_port: "11434"
    webui_port: "8080"
    data_dir: "{{ ansible_facts['env']['HOME'] }}/.local/share/ai-box"
    # Manuelle GPU-Auswahl bei mehreren GPUs im System
    # Hersteller:   "nvidia", "amd", "intel", "cpu", "" (= automatisch)
    # Mit Index:    "amd:0" (erste AMD), "amd:1" (zweite AMD)
    #               "nvidia:0" (erste NVIDIA), "nvidia:1" (zweite NVIDIA)
    # Per CLI:      -e gpu_override=amd:1
    gpu_override: ""
    # HSA_OVERRIDE_GFX_VERSION für AMD ROCm in Podman-Containern.
    # In Containern fehlt /sys/module/amdgpu/version – ROCm kann die
    # GPU-Architektur nicht automatisch ermitteln. Diese Variable gibt
    # die GFX-Version manuell vor.
    # Wert ermitteln (auf dem Host, nicht im Container):
    #   rocminfo | grep 'Name:' | grep gfx
    #   Ausgabe z.B. "gfx1030" → Wert "10.3.0"
    # Häufige Werte:
    #   gfx1010 → 10.1.0  (RX 5700 XT, RDNA1)
    #   gfx1030 → 10.3.0  (RX 6800/6900 XT, RDNA2)
    #   gfx1031 → 10.3.1  (RX 6750 XT, RDNA2)
    #   gfx1032 → 10.3.2  (RX 6600 XT, RDNA2)
    #   gfx1100 → 11.0.0  (RX 7900 XTX, RDNA3)
    #   gfx1101 → 11.0.1  (RX 7800 XT, RDNA3)
    # Leer lassen wenn ROCm die GPU nativ erkennt (kein Podman-Container).
    # Per Inventory setzen: amd_gfx_version=10.3.0
    # Per CLI überschreiben: -e amd_gfx_version=11.0.0
    amd_gfx_version: ""

  tasks:
    - name: "Alle GPUs per lspci auflisten"
      ansible.builtin.shell:
        # Nur echte GPU-PCI-Klassen: "VGA compatible controller",
        # "3D controller", "Display controller" – NVMe/Storage explizit ausgeschlossen
        cmd: >-
          lspci | grep -E 'VGA compatible controller|3D controller|Display controller'
          | grep -iv 'non-volatile\|nvme\|storage\|memory controller'
      register: gpu_list_all
      failed_when: false
      changed_when: false

    - name: "Gefundene GPUs anzeigen"
      ansible.builtin.debug:
        msg: "{{ gpu_list_all.stdout_lines if gpu_list_all.stdout_lines | length > 0 else ['Keine GPU erkannt'] }}"

    - name: "NVIDIA GPUs per lspci auflisten"
      ansible.builtin.shell:
        cmd: >-
          lspci | grep -E 'VGA compatible controller|3D controller|Display controller'
          | grep -i nvidia
      register: nvidia_lspci_check
      failed_when: false
      changed_when: false

    - name: "AMD GPUs per lspci auflisten"
      ansible.builtin.shell:
        cmd: >-
          lspci | grep -E 'VGA compatible controller|3D controller|Display controller'
          | grep -iE 'amd|radeon|advanced micro devices'
      register: amd_lspci_check
      failed_when: false
      changed_when: false

    - name: "Intel GPUs per lspci auflisten"
      ansible.builtin.shell:
        cmd: lspci | grep -iE 'intel.*(graphics|vga|display|uhd|iris|arc)'
      register: intel_lspci_check
      failed_when: false
      changed_when: false

    - name: "GPU-Hersteller und Index aus gpu_override parsen"
      ansible.builtin.set_fact:
        _gpu_vendor: "{{ gpu_override.split(':')[0] if gpu_override != '' else '' }}"
        _gpu_index:  "{{ gpu_override.split(':')[1] | int if ':' in gpu_override else 0 }}"

    - name: "GPU-Flags setzen (Override oder auto-erkannt)"
      ansible.builtin.set_fact:
        gpu_nvidia: "{{ (_gpu_vendor == 'nvidia') or (_gpu_vendor == '' and nvidia_lspci_check.rc == 0) }}"
        gpu_amd:    "{{ (_gpu_vendor == 'amd')    or (_gpu_vendor == '' and amd_lspci_check.rc == 0) }}"
        gpu_intel:  "{{ (_gpu_vendor == 'intel')  or (_gpu_vendor == '' and intel_lspci_check.rc == 0) }}"

    - name: "AMD DRI-Node fuer gewaehlten Index ermitteln"
      ansible.builtin.shell:
        cmd: "ls /dev/dri/renderD* 2>/dev/null | sort | sed -n '{{ (_gpu_index | int) + 1 }}p'"
      register: amd_dri_node
      when: gpu_amd
      failed_when: false
      changed_when: false

    - name: "AMD DRI-Node setzen (Fallback renderD128)"
      ansible.builtin.set_fact:
        amd_render_node: "{{ amd_dri_node.stdout | default('/dev/dri/renderD128') | trim }}"
      when: gpu_amd

    - name: "NVIDIA GPU-Index fuer CUDA_VISIBLE_DEVICES setzen"
      ansible.builtin.set_fact:
        nvidia_gpu_index: "{{ _gpu_index }}"
      when: gpu_nvidia

    - name: "GPU-Ergebnis anzeigen"
      ansible.builtin.debug:
        msg: >-
          GPU-Erkennung: NVIDIA={{ gpu_nvidia }} AMD={{ gpu_amd }} Intel={{ gpu_intel }}
          {{ '(manuell: ' + gpu_override + ')' if gpu_override != '' else '(automatisch via lspci)' }}

    - name: "Warnung – mehrere GPU-Hersteller erkannt"
      ansible.builtin.debug:
        msg: >
          ⚠️  Mehrere GPU-Hersteller erkannt!
          Aktive Priorität: {{ 'NVIDIA' if gpu_nvidia else 'AMD' if gpu_amd else 'Intel' }}.
          Verwende gpu_override um eine bestimmte GPU festzulegen (z.B. -e gpu_override=amd:0).
      when: (gpu_nvidia | bool | int) + (gpu_amd | bool | int) + (gpu_intel | bool | int) > 1

    - name: "Warnung – mehrere NVIDIA GPUs erkannt"
      ansible.builtin.debug:
        msg: >
          ⚠️  {{ nvidia_lspci_check.stdout_lines | length }} NVIDIA GPUs gefunden.
          Aktiv: GPU-Index {{ nvidia_gpu_index | default(0) }}.
          Für eine andere GPU: -e gpu_override=nvidia:1
      when:
        - gpu_nvidia
        - nvidia_lspci_check.stdout_lines | length > 1

    - name: "Warnung – mehrere AMD GPUs erkannt"
      ansible.builtin.debug:
        msg: >
          ⚠️  {{ amd_lspci_check.stdout_lines | length }} AMD GPUs gefunden.
          Aktiv: {{ amd_render_node | default('/dev/dri/renderD128') }} (Index {{ _gpu_index }}).
          Für eine andere GPU: -e gpu_override=amd:1
      when:
        - gpu_amd
        - amd_lspci_check.stdout_lines | length > 1

    - name: "Warnung – keine GPU erkannt, CPU-only Modus"
      ansible.builtin.debug:
        msg: "⚠️ Keine GPU erkannt – Ollama läuft im CPU-only Modus."
      when: not gpu_nvidia and not gpu_amd and not gpu_intel

    - name: "Headless-Modus erkennen (kein DISPLAY oder WAYLAND_DISPLAY)"
      ansible.builtin.set_fact:
        is_headless: >-
          {{ (ansible_facts['env'].get('DISPLAY', '') == '') and
             (ansible_facts['env'].get('WAYLAND_DISPLAY', '') == '') }}

    - name: "Modus anzeigen"
      ansible.builtin.debug:
        msg: "{{ 'Headless-Server erkannt – Desktop-Integration wird übersprungen.' if is_headless else 'Desktop erkannt – Desktop-Integration wird eingerichtet.' }}"

    - name: "User zur render-Gruppe hinzufuegen (AMD/Intel)"
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        groups: render
        append: true
      become: true
      when: gpu_amd or gpu_intel

    - name: "User zur video-Gruppe hinzufuegen"
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        groups: video
        append: true
      become: true

    - name: "Gruppenrechte fuer /dev/kfd setzen (AMD)"
      ansible.builtin.file:
        path: /dev/kfd
        group: render
        mode: "0660"
      become: true
      ignore_errors: true
      when: gpu_amd

    - name: "Datenverzeichnis fuer Container anlegen"
      ansible.builtin.file:
        path: "{{ data_dir }}"
        state: directory
        mode: "0755"

    - name: "Pruefen ob Container bereits existiert"
      ansible.builtin.command: podman container exists {{ container_name }}
      register: container_exists
      failed_when: false
      changed_when: false

    - name: "Podman Container anlegen (NVIDIA)"
      ansible.builtin.command: >-
        podman run -d
        --name {{ container_name }}
        --device nvidia.com/gpu={{ nvidia_gpu_index | default(0) }}
        --security-opt=label=disable
        -p {{ ollama_port }}:11434
        -p {{ webui_port }}:8080
        -v {{ data_dir }}:/data:z
        -e OLLAMA_KEEP_ALIVE=0
        -e CUDA_VISIBLE_DEVICES={{ nvidia_gpu_index | default(0) }}
        -e DATA_DIR=/data
        ubuntu:24.04 sleep infinity
      when:
        - container_exists.rc != 0
        - gpu_nvidia

    - name: "Podman Container anlegen (AMD)"
      ansible.builtin.command: >-
        podman run -d
        --name {{ container_name }}
        --device /dev/kfd
        --device {{ amd_render_node | default('/dev/dri/renderD128') }}
        --group-add render
        --group-add video
        --security-opt=label=disable
        -p {{ ollama_port }}:11434
        -p {{ webui_port }}:8080
        -v {{ data_dir }}:/data:z
        -e OLLAMA_KEEP_ALIVE=0
        {% if amd_gfx_version != '' %}-e HSA_OVERRIDE_GFX_VERSION={{ amd_gfx_version }}{% endif %}
        -e DATA_DIR=/data
        ubuntu:24.04 sleep infinity
      when:
        - container_exists.rc != 0
        - gpu_amd
        - not gpu_nvidia

    - name: "Podman Container anlegen (Intel)"
      ansible.builtin.command: >-
        podman run -d
        --name {{ container_name }}
        --device /dev/dri
        --security-opt=label=disable
        -p {{ ollama_port }}:11434
        -p {{ webui_port }}:8080
        -v {{ data_dir }}:/data:z
        -e OLLAMA_KEEP_ALIVE=0
        -e DATA_DIR=/data
        ubuntu:24.04 sleep infinity
      when:
        - container_exists.rc != 0
        - gpu_intel
        - not gpu_nvidia
        - not gpu_amd

    - name: "Podman Container anlegen (CPU-only Fallback)"
      ansible.builtin.command: >-
        podman run -d
        --name {{ container_name }}
        --security-opt=label=disable
        -p {{ ollama_port }}:11434
        -p {{ webui_port }}:8080
        -v {{ data_dir }}:/data:z
        -e OLLAMA_KEEP_ALIVE=0
        -e DATA_DIR=/data
        ubuntu:24.04 sleep infinity
      when:
        - container_exists.rc != 0
        - not gpu_nvidia
        - not gpu_amd
        - not gpu_intel

    - name: "Container starten falls gestoppt"
      ansible.builtin.command: podman start {{ container_name }}
      register: container_start
      failed_when: container_start.rc not in [0, 125]
      changed_when: container_start.rc == 0
      when: container_exists.rc == 0

- name: "Text-KI Setup innerhalb des Podman Containers"
  hosts: ai_hosts
  become: false
  gather_facts: false

  vars:
    container_name: "ai-box"
    # hf_token wird aus secrets.yml übernommen (Play 1), Fallback leer
    hf_token: "{{ hf_token | default('') }}"

  tasks:
    - name: "APT-Cache updaten"
      ansible.builtin.command: podman exec -u root {{ container_name }} apt-get update -qq
      changed_when: false

    - name: "Erforderliche Basis-Pakete installieren"
      ansible.builtin.command: >-
        podman exec -u root {{ container_name }}
        apt-get install -y curl wget gpg ca-certificates zstd python3 python3-pip supervisor
      changed_when: true

    - name: "Keyrings Verzeichnis erstellen"
      ansible.builtin.command: podman exec -u root {{ container_name }} mkdir -p /etc/apt/keyrings
      changed_when: false

    - name: "NVIDIA CUDA Repository einrichten"
      ansible.builtin.command: >-
        podman exec -u root {{ container_name }} bash -c
        "curl -fsSL https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb -o /tmp/cuda-keyring.deb &&
         dpkg -i /tmp/cuda-keyring.deb &&
         apt-get update -qq"
      when: gpu_nvidia | default(false) | bool
      changed_when: true

    - name: "AMD ROCm GPG-Key herunterladen"
      ansible.builtin.command: >-
        podman exec -u root {{ container_name }} bash -c
        "curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor > /etc/apt/keyrings/rocm.gpg"
      when: gpu_amd | default(false) | bool
      changed_when: true

    - name: "AMD ROCm APT-Repository hinzufuegen"
      ansible.builtin.command: >-
        podman exec -u root {{ container_name }} bash -c
        "echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/latest noble main' > /etc/apt/sources.list.d/rocm.list &&
         apt-get update -qq"
      when: gpu_amd | default(false) | bool
      changed_when: true

    - name: "APT-Pinning fuer ROCm einrichten"
      ansible.builtin.command: >-
        podman exec -u root {{ container_name }} bash -c
        "printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n'
        > /etc/apt/preferences.d/rocm-pin-600"
      when: gpu_amd | default(false) | bool
      changed_when: true

    - name: "AMD ROCm installieren"
      ansible.builtin.command: >-
        podman exec -u root {{ container_name }} bash -c
        "apt-get install -y rocm"
      when: gpu_amd | default(false) | bool
      async: 3600
      poll: 15
      changed_when: true

    - name: "Intel oneAPI Repository einrichten"
      ansible.builtin.command: >-
        podman exec -u root {{ container_name }} bash -c
        "curl -fsSL https://repositories.intel.com/gpu/intel-graphics.key | gpg --dearmor > /etc/apt/keyrings/intel-graphics.gpg &&
         echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/intel-graphics.gpg] https://repositories.intel.com/gpu/ubuntu noble client' > /etc/apt/sources.list.d/intel-gpu.list &&
         apt-get update -qq"
      when: gpu_intel | default(false) | bool
      changed_when: true

    - name: "Intel Level Zero installieren"
      ansible.builtin.command: >-
        podman exec -u root {{ container_name }}
        apt-get install -y intel-opencl-icd intel-level-zero-gpu level-zero
      when: gpu_intel | default(false) | bool
      changed_when: true

    - name: "Pruefen ob Ollama bereits installiert ist"
      ansible.builtin.command: podman exec {{ container_name }} which ollama
      register: ollama_check
      failed_when: false
      changed_when: false

    - name: "Ollama ueber Install-Skript installieren"
      ansible.builtin.command: >-
        podman exec -u root {{ container_name }} bash -c
        "curl -fsSL https://ollama.com/install.sh | sh"
      when: ollama_check.rc != 0
      changed_when: true

    - name: "Open WebUI ueber pip installieren"
      ansible.builtin.command: >-
        podman exec -u root {{ container_name }}
        pip3 install open-webui --break-system-packages
      register: webui_install
      changed_when: "'Successfully installed' in webui_install.stdout"

    - name: "Supervisor-Konfiguration schreiben (mit optionalem HF_TOKEN)"
      # HF_TOKEN wird nur gesetzt wenn secrets.yml einen Wert enthält.
      # no_log verhindert dass der Token im Ansible-Output erscheint.
      ansible.builtin.command: >-
        podman exec -u root {{ container_name }} bash -c
        "mkdir -p /etc/supervisor/conf.d && cat > /etc/supervisor/conf.d/ai-box.conf << 'SUPEOF'
[supervisord]
nodaemon=false
logfile=/data/supervisord.log
pidfile=/var/run/supervisord.pid

[program:ollama]
command=ollama serve
autostart=true
autorestart=true
startretries=5
stdout_logfile=/data/ollama.log
stderr_logfile=/data/ollama.err

[program:open-webui]
command=open-webui serve
autostart=true
autorestart=true
startretries=5
startsecs=15
environment={{ 'HF_TOKEN=\"' + hf_token + '\",' if hf_token != '' else '' }}PYTHONUNBUFFERED=\"1\"
stdout_logfile=/data/webui.log
stderr_logfile=/data/webui.err
SUPEOF"
      changed_when: true
      no_log: true

    - name: "Laufenden supervisord neu laden (falls aktiv)"
      ansible.builtin.command: >-
        podman exec {{ container_name }} bash -c
        "supervisorctl reread && supervisorctl update"
      register: supervisord_reload
      failed_when: false
      changed_when: supervisord_reload.rc == 0

    - name: "Pruefen ob supervisord bereits laeuft"
      ansible.builtin.command: >-
        podman exec {{ container_name }} bash -c
        "pgrep -x supervisord > /dev/null"
      register: supervisord_running
      failed_when: false
      changed_when: false

    - name: "supervisord starten (startet Ollama + Open WebUI automatisch)"
      ansible.builtin.command: >-
        podman exec -d {{ container_name }} bash -c
        "supervisord -c /etc/supervisor/supervisord.conf"
      when: supervisord_running.rc != 0
      changed_when: true

    - name: "Warten bis ollama serve bereit ist (max 30s)"
      ansible.builtin.command: >-
        podman exec {{ container_name }} bash -c
        "curl -sf http://localhost:11434/api/tags > /dev/null"
      register: ollama_ready
      until: ollama_ready.rc == 0
      retries: 10
      delay: 3
      changed_when: false

    - name: "Warten bis Open WebUI bereit ist (max 60s)"
      # Open WebUI braucht beim ersten Start länger (~30s) für DB-Migration
      # und das Laden der Python-Module.
      ansible.builtin.command: >-
        podman exec {{ container_name }} bash -c
        "curl -sf http://localhost:8080 > /dev/null"
      register: webui_ready
      until: webui_ready.rc == 0
      retries: 20
      delay: 3
      changed_when: false

- name: "systemd User-Service und Desktop-Integration"
  hosts: ai_hosts
  become: false

  vars:
    container_name: "ai-box"
    ollama_port: "11434"
    webui_port: "8080"

  tasks:
    - name: "systemd User-Service Verzeichnis sicherstellen"
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user"
        state: directory
        mode: "0755"

    - name: "systemd User-Service fuer ai-box erstellen"
      ansible.builtin.copy:
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/ai-box.service"
        mode: "0644"
        content: |
          [Unit]
          Description=AI Box Podman Container (Ollama + Open WebUI)
          After=default.target

          [Service]
          Type=simple
          ExecStart=podman start -a {{ container_name }}
          ExecStartPost=/bin/sh -c 'sleep 2 && podman exec -d {{ container_name }} supervisord -c /etc/supervisor/supervisord.conf'
          ExecStop=podman stop {{ container_name }}
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=default.target

    - name: "systemd User-Service aktivieren und starten"
      ansible.builtin.systemd:
        name: ai-box.service
        state: started
        enabled: true
        scope: user
        daemon_reload: true

    - name: "Lokales bin-Verzeichnis sicherstellen"
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: "0755"

    - name: "Launcher-Skript aus Template erzeugen"
      ansible.builtin.template:
        src: templates/text-ki-start.j2
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/text-ki-start"
        mode: "0755"

    - name: "Lokales applications-Verzeichnis sicherstellen"
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/share/applications"
        state: directory
        mode: "0755"
      when: not (is_headless | default(true) | bool)

    - name: "Desktop-Eintrag erstellen"
      ansible.builtin.copy:
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/applications/text-ki.desktop"
        mode: "0644"
        content: |
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Text KI
          GenericName=Lokale Text-KI
          Comment=Ollama und Open WebUI starten
          Exec={{ ansible_facts['env']['HOME'] }}/.local/bin/text-ki-start
          Icon=text-editor
          Terminal=false
          Categories=Science;Education;
          Keywords=AI;LLM;Ollama;
          StartupNotify=true
      when: not (is_headless | default(true) | bool)

    - name: "Desktop-Datenbank aktualisieren"
      ansible.builtin.command: >-
        update-desktop-database {{ ansible_facts['env']['HOME'] }}/.local/share/applications
      changed_when: false
      failed_when: false
      when: not (is_headless | default(true) | bool)

    - name: "Zusammenfassung"
      ansible.builtin.debug:
        msg:
